<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html{background:#0d0a08;margin:0;padding:0}
body{width:1080px;height:1620px;overflow:hidden;font-family:'Inter',sans-serif;color:#fff;margin:0;padding:0;background:#0d0a08}
.card{position:relative;width:100%;height:100%;background-image:url('{{HERO_IMAGE}}');background-size:cover;background-position:center 25%;background-color:#1a0f08}
.bg-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.4) 0%,rgba(0,0,0,0.15) 25%,rgba(0,0,0,0.1) 45%,rgba(0,0,0,0.7) 70%,rgba(0,0,0,0.92) 100%)}
.tag{position:absolute;top:48px;right:48px;background:rgba(255,255,255,0.18);backdrop-filter:blur(12px);color:#fff;padding:10px 22px;border-radius:50px;font-size:22px;font-weight:600;z-index:10;border:1px solid rgba(255,255,255,0.25)}
.eyebrow{position:absolute;top:56px;left:56px;color:#fff;font-size:20px;font-weight:700;letter-spacing:6px;text-transform:uppercase;z-index:10;text-shadow:0 2px 12px rgba(0,0,0,0.85)}
.collage{position:absolute;top:580px;left:48px;right:48px;display:grid;grid-template-columns:1fr 1fr;gap:18px;z-index:5}
.poly{aspect-ratio:1;background-size:cover;background-position:center;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,0.55);transform:rotate(-1.5deg);position:relative;overflow:hidden}
.poly:nth-child(2){transform:rotate(1.5deg)}
.poly-label{position:absolute;bottom:14px;left:18px;color:#fff;font-size:22px;font-weight:600;letter-spacing:0.3px;text-shadow:0 2px 8px rgba(0,0,0,0.85)}
.body{position:absolute;left:56px;right:56px;bottom:80px;color:#fff;z-index:5}
.day{font-family:'Playfair Display',serif;font-size:108px;font-weight:900;line-height:1;letter-spacing:-3px;margin-bottom:12px;text-shadow:0 6px 24px rgba(0,0,0,0.8)}
.subtitle{font-family:'Playfair Display',serif;font-size:48px;font-weight:700;line-height:1.1;color:#f5e6d3;margin-bottom:36px;text-shadow:0 4px 18px rgba(0,0,0,0.85)}
.bullets{font-size:26px;font-weight:500;line-height:1.55;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,0.85)}
.bullets div{margin-bottom:10px;padding-left:26px;position:relative}
.bullets div::before{content:'·';position:absolute;left:0;font-weight:900;font-size:42px;line-height:0.5;top:14px;color:#f0883e}
.poetic{font-family:'Playfair Display',serif;font-style:italic;font-size:28px;font-weight:500;line-height:1.4;color:#f5e6d3;margin-top:32px;text-shadow:0 2px 10px rgba(0,0,0,0.85)}
</style></head><body>
<div class="card">
<div class="bg-overlay"></div>
<div class="eyebrow">{{EYEBROW}}</div>
<div class="tag">{{PAGE_TAG}}</div>
<div class="collage">{{TILES_HTML}}</div>
<div class="body">
<div class="day">{{TITLE}}</div>
<div class="subtitle">{{SUBTITLE}}</div>
<div class="bullets">{{BULLETS_HTML}}</div>
<div class="poetic">{{POETIC}}</div>
</div>
</div>
</body></html>
