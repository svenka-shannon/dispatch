<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html{background:#0d0a08;margin:0;padding:0}
body{width:1080px;height:1620px;overflow:hidden;font-family:'Inter',sans-serif;color:#fff;margin:0;padding:0;background:#0d0a08}
.card{position:relative;width:100%;height:100%;background-image:url('{{HERO_IMAGE}}');background-size:cover;background-position:center 30%;background-color:#1a0f08}
.bg-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.30) 0%,rgba(0,0,0,0.30) 18%,rgba(0,0,0,0.62) 34%,rgba(0,0,0,0.86) 52%,rgba(0,0,0,0.93) 100%)}
.tag{position:absolute;top:48px;right:48px;background:rgba(255,255,255,0.18);backdrop-filter:blur(12px);color:#fff;padding:10px 22px;border-radius:50px;font-size:22px;font-weight:600;z-index:10;border:1px solid rgba(255,255,255,0.25)}
.eyebrow{position:absolute;top:56px;left:56px;color:#fff;font-size:20px;font-weight:700;letter-spacing:6px;text-transform:uppercase;z-index:10;text-shadow:0 2px 12px rgba(0,0,0,0.85)}
.head{position:absolute;top:150px;left:56px;right:56px;z-index:6}
.title{font-family:'Playfair Display',serif;font-size:96px;font-weight:900;line-height:0.98;letter-spacing:-3px;text-shadow:0 6px 24px rgba(0,0,0,0.85)}
.subtitle{font-family:'Playfair Display',serif;font-size:40px;font-weight:700;line-height:1.15;color:#f5e6d3;margin-top:14px;text-shadow:0 4px 18px rgba(0,0,0,0.85)}
.rows{position:absolute;left:56px;right:56px;top:430px;bottom:230px;z-index:6;display:flex;flex-direction:column;justify-content:center}
.row{display:flex;align-items:flex-start;gap:20px;padding:20px 24px;border-radius:16px;background:rgba(12,10,9,0.55);border:1px solid rgba(255,255,255,0.10);margin-bottom:13px}
.row.pick{background:rgba(240,136,62,0.30);border:1px solid rgba(240,136,62,0.55)}
.row-main{flex:1;min-width:0}
.row-name{font-size:31px;font-weight:700;line-height:1.2;letter-spacing:-0.3px}
.row.pick .row-name{color:#ffb877}
.row-note{font-size:23px;font-weight:400;line-height:1.35;color:#c9bfb5;margin-top:7px}
.row-price{font-family:'Playfair Display',serif;font-size:40px;font-weight:900;line-height:1;white-space:nowrap;padding-top:4px;letter-spacing:-1px}
.row.pick .row-price{color:#f0883e}
.badge{display:inline-block;font-size:17px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:#f0883e;margin-bottom:7px}
.foot{position:absolute;left:56px;right:56px;bottom:74px;z-index:6}
.total{font-size:27px;font-weight:600;color:#fff;padding-top:22px;border-top:1px solid rgba(255,255,255,0.2)}
.total b{font-family:'Playfair Display',serif;font-size:36px;color:#f0883e;font-weight:900}
.poetic{font-family:'Playfair Display',serif;font-style:italic;font-size:27px;font-weight:500;line-height:1.4;color:#f5e6d3;margin-top:18px;text-shadow:0 2px 10px rgba(0,0,0,0.85)}
</style></head><body>
<div class="card">
<div class="bg-overlay"></div>
<div class="eyebrow">{{EYEBROW}}</div>
<div class="tag">{{PAGE_TAG}}</div>
<div class="head">
<div class="title">{{TITLE}}</div>
<div class="subtitle">{{SUBTITLE}}</div>
</div>
<div class="rows">{{ROWS_HTML}}</div>
<div class="foot">
<div class="total">{{TOTAL}}</div>
<div class="poetic">{{POETIC}}</div>
</div>
</div>
</body></html>
